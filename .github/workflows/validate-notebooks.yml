name: Validate Notebooks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Notebook structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validator
        run: pip install nbformat
      - name: Validate all notebooks
        run: python .github/scripts/validate_notebooks.py

  execute:
    name: Execute all notebooks
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system libraries for OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install nbformat nbconvert ipykernel papermill
          pip install numpy matplotlib opencv-python-headless scipy ipywidgets scikit-image pillow
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics transformers
          python -m ipykernel install --user --name python3
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: model-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            model-cache-${{ runner.os }}-
      - name: Execute every notebook (repo root as cwd)
        env:
          MPLBACKEND: Agg
        run: |
          set -e
          mkdir -p /tmp/executed
          notebooks=$(find notebooks -name "*.ipynb" | sort)
          for nb in $notebooks; do
            echo "================================================"
            echo "=== Executing $nb ==="
            echo "================================================"
            papermill "$nb" "/tmp/executed/$(basename "$nb")" \
              --cwd . --kernel python3 --execution-timeout 1200
          done
