name: Validate Notebooks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Notebook structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validator
        run: pip install nbformat
      - name: Validate all notebooks
        run: python .github/scripts/validate_notebooks.py

  execute:
    name: Execute foundation notebooks
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system libraries for OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install nbformat nbconvert ipykernel papermill
          pip install numpy matplotlib opencv-python-headless scipy ipywidgets
          python -m ipykernel install --user --name python3
      - name: Execute notebooks (repo root as cwd)
        env:
          MPLBACKEND: Agg
        run: |
          mkdir -p /tmp/executed
          for nb in \
            notebooks/01_image_basics/01_image_basics.ipynb \
            notebooks/02_color_spaces/02_color_spaces.ipynb \
            notebooks/03_optics_calibration/03_optics_calibration.ipynb \
            notebooks/04_image_structures/04_image_structures.ipynb \
            notebooks/05_geometric_transforms/05_geometric_transforms.ipynb \
            notebooks/06_filtering_morphology/06_filtering_morphology.ipynb \
            notebooks/07_segmentation/07_segmentation.ipynb \
            notebooks/08_keypoint_features/08_keypoint_features.ipynb \
            notebooks/12_3d_point_clouds/12_3d_point_clouds.ipynb \
            notebooks/13_motion_tracking/13_motion_tracking.ipynb ; do
            echo "=== Executing $nb ==="
            papermill "$nb" "/tmp/executed/$(basename "$nb")" \
              --cwd . --kernel python3 --execution-timeout 900
          done
